<button type="button" data-id="{{ p.id }}" data-cat="{{ p.category.slug }}" data-name="{{ p.name|lower }}"
  class="product reveal group text-left bg-white dark:bg-plum rounded-3xl p-2 shadow-sm hover:shadow-xl hover:shadow-blush-200/50 dark:hover:shadow-none transition-all duration-300 hover:-translate-y-1">
 <div class="aspect-[4/5] rounded-2xl overflow-hidden ph grid place-items-center text-5xl relative">
  {% if p.main_image %}<img src="{{ p.main_image }}" alt="{{ p.name }}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">{% else %}🌸{% endif %}
  <span class="absolute top-2 left-2 text-xs px-2 py-1 rounded-full bg-white/90 dark:bg-night/80 text-lilac-500 font-semibold">{{ p.category.name }}</span>
  {% if p.stock == 0 %}<span class="absolute inset-0 bg-white/60 dark:bg-night/60 grid place-items-center font-bold">Sold out</span>{% endif %}
 </div>
 <div class="px-2 pt-3 pb-2"><h3 class="font-semibold leading-snug">{{ p.name }}</h3>
  <p class="text-blush-500 font-bold">{{ p.price|floatformat:0 }} DZD</p></div>
</button>
